      <img src="{{ '/assets/figma-logo.svg' | relative_url }}" alt="" width="11" height="16" class="hidden h-4 w-auto sm:block" />
      <span class="sm:hidden">Get plugin</span><span class="hidden sm:inline">Get the plugin</span>

        </ul>
      </div>
    </details>
  </nav>
</header>

<script>
  document.querySelectorAll('[data-nav-menu]').forEach(function (menu) {
    menu.addEventListener('click', function (event) {
      if (event.target.closest('a')) menu.removeAttribute('open');
    });
    document.addEventListener('click', function (event) {
      if (menu.open && !menu.contains(event.target)) menu.removeAttribute('open');
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && menu.open) {
        menu.removeAttribute('open');
        menu.querySelector('summary').focus();
      }
    });
  });
</script>
